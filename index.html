<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFFFFF">
  <meta name="description" content="Your group’s tea break: pick together, order once, split the bill. No accounts.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Chaikadi">
  <meta name="referrer" content="no-referrer">
  <title>Chaikadi · Decide, order, split.</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <script>try { document.documentElement.dataset.theme = localStorage.getItem('chaikadi-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); } catch { /* storage blocked */ }</script>
  <script>
    // If the app failed to start (e.g. mismatched cached files after an
    // update), fetch the latest version and reload once.
    setTimeout(function () {
      if (window.chaikadiStarted || !navigator.serviceWorker) return;
      try { if (sessionStorage.getItem('chaikadi-recovered')) return; sessionStorage.setItem('chaikadi-recovered', '1'); } catch (e) { return; }
      navigator.serviceWorker.addEventListener('controllerchange', function () { location.reload(); });
      navigator.serviceWorker.getRegistration().then(function (r) { return r && r.update(); }).catch(function () {});
      setTimeout(function () { location.reload(); }, 6000);
    }, 5000);
  </script>
  <link rel="stylesheet" href="./styles.css">
  <script defer src="./vendor/peerjs.min.js"></script>
  <script defer src="./vendor/qrcode.js"></script>
  <script defer src="./vendor/jsQR.js"></script>
  <script type="module" src="./js/main.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="app"><p>Opening Chaikadi…</p></div>
  <noscript>Chaikadi needs JavaScript to connect your group and save your picks. Enable JavaScript and reopen this page.</noscript>
</body>
</html>
