name: Bug report
description: Something in Chaikadi broke or felt wrong
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping. Chaikadi is everyone's project, and a short note is enough.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what did you see instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can we see it?
      placeholder: "1. Create a group\n2. Join from a second phone\n3. ..."
  - type: input
    id: device
    attributes:
      label: Phone and browser
      placeholder: Pixel 7, Chrome 130 (installed app or browser tab)
  - type: input
    id: version
    attributes:
      label: App version
      description: Settings, bottom of the page.
